services:
  postgres:
    image: postgres:17-alpine
    container_name: dreamingcloud-postgres
    environment:
      POSTGRES_USER: dreamingcloud
      POSTGRES_PASSWORD: dreamingcloud
      POSTGRES_DB: dreamingcloud
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dreamingcloud -d dreamingcloud']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: dreamingcloud-valkey
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dreamingcloud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dreamingcloud
      MINIO_ROOT_PASSWORD: dreamingcloud
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: dreamingcloud-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 dreamingcloud dreamingcloud;
      mc mb --ignore-existing local/dreamingcloud-media;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
